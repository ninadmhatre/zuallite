# nginx vhost for the Ghost blog subdomain.
#
# HTTP-only on purpose -- `certbot --nginx` rewrites this in place to add the
# TLS listeners and the http->https redirect. See nginx-zuallite.conf for why.
#
# __BLOG_DOMAIN__ is substituted by deploy/provision-ghost.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __BLOG_DOMAIN__;

    access_log /var/log/nginx/ghost.access.log;
    error_log  /var/log/nginx/ghost.error.log;

    # Ghost's admin uploads images and theme zips through this proxy.
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:2368;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Ghost trusts this to decide whether it is being served over TLS.
        # Without it, Ghost redirect-loops or emits http:// URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
