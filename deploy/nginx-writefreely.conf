# nginx vhost for the WriteFreely blog subdomain.
#
# HTTP-only on purpose -- `certbot --nginx` rewrites this in place to add the
# TLS listeners and the http->https redirect.
#
# __BLOG_DOMAIN__ is substituted by deploy/setup.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __BLOG_DOMAIN__;

    access_log /var/log/nginx/writefreely.access.log;
    error_log  /var/log/nginx/writefreely.error.log;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
