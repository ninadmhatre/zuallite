# nginx vhost for the Flask portfolio app (apex + www).
#
# This file is HTTP-only on purpose. `certbot --nginx` rewrites it in place to
# add the TLS listeners, certificate paths and the http->https redirect, which
# is far more reliable than shipping ssl_certificate paths that do not exist
# yet (nginx refuses to start if they are missing).
#
# The blog subdomain is NOT configured here -- see nginx-writefreely.conf.
#
# __DOMAIN__ is substituted by deploy/provision.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Canonical host. Kept inside the server block (rather than a separate
    # vhost) so certbot's rewrite does not duplicate it.
    if ($host = www.__DOMAIN__) {
        return 301 https://__DOMAIN__$request_uri;
    }

    access_log /var/log/nginx/zuallite.access.log;
    error_log  /var/log/nginx/zuallite.error.log;

    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Serve static assets straight off disk -- gunicorn never sees them.
    location /static/ {
        alias /srv/zuallite/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
